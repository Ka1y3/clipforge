<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClipForge</title>
<style>
:root{color-scheme:dark;font:14px Segoe UI,Arial;background:#101117;color:#f5f4fa}*{box-sizing:border-box}body{margin:0;display:grid;grid-template-columns:210px 1fr;min-height:100vh}aside{background:#171923;padding:22px;border-right:1px solid #30313d}h1{font-size:25px;margin:0 0 5px}h2{font-size:18px}nav{display:grid;gap:7px;margin-top:24px}nav button,.btn{padding:9px 12px;border:1px solid #383948;border-radius:8px;background:#282938;color:#eee;cursor:pointer;text-align:left}nav button.active,.primary{background:#a78bfa;color:#17131f;border-color:#a78bfa;font-weight:700}main{padding:28px;max-width:1400px;width:100%}.muted{color:#999caf}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{background:#191b24;border:1px solid #30313d;border-radius:12px;padding:16px;margin:12px 0}.stat{font-size:28px;font-weight:700}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #30313d}th{color:#999caf}input,select{background:#101117;color:white;border:1px solid #383948;border-radius:7px;padding:9px}a{color:#c4b5fd}.pill{background:#303143;border-radius:30px;padding:4px 9px;font-size:12px}.danger{color:#ff8585}.empty{padding:20px;text-align:center;color:#999caf}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.moment{background:#191b24;border:1px solid #30313d;border-radius:12px;overflow:hidden}.moment video{width:100%;max-height:300px;aspect-ratio:9/16;object-fit:contain;background:#08090d}.moment section{padding:12px}#toast{position:fixed;right:20px;bottom:20px;background:#282938;border:1px solid #555;padding:12px;border-radius:8px;display:none}
@media(max-width:720px){body{display:block}aside{padding:12px}nav{display:flex;overflow:auto;margin-top:10px}nav button{white-space:nowrap}main{padding:15px}}
</style></head><body><aside><h1>⚡ ClipForge</h1><div class="muted">Twitch → clips courts</div><nav id="nav"></nav></aside><main id="app">Chargement…</main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let page="dashboard",status={};
const pages=[["dashboard","Tableau de bord"],["vods","VOD"],["moments","Moments"],["clips","Clips"],["settings","Paramètres"]];
function msg(s){let t=$("#toast");t.textContent=s;t.style.display="block";clearTimeout(t.t);t.t=setTimeout(()=>t.style.display="none",3500)}
async function api(url,method="GET",body){let r=await fetch(url,{method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined});let d=await r.json();if(!r.ok)throw Error(d.detail||"Erreur "+r.status);return d}
async function run(fn){try{await fn()}catch(e){msg(e.message)}}
function nav(){ $("#nav").innerHTML=pages.map(([k,n])=>'<button class="'+(page===k?"active":"")+'" onclick="go(\''+k+'\')">'+n+'</button>').join("")}
window.go=async k=>{page=k;nav();await render()};
const fmt=s=>{s=Math.round(s||0);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
async function render(){try{status=await api("/api/status");if(page==="dashboard")await dash();if(page==="vods")await vods();if(page==="moments")await moments();if(page==="clips")await clips();if(page==="settings")await settings()}catch(e){$("#app").innerHTML='<div class="card"><h2>Serveur indisponible</h2>'+esc(e.message)+'<p class="muted">Démarre ClipForge avec Lancer-ClipForge.bat puis ouvre http://localhost:8000.</p></div>'}}
async function dash(){let c=status.counts||{},j=await api("/api/jobs?limit=8");$("#app").innerHTML='<h1>Tableau de bord</h1><p class="muted">État de ton espace ClipForge</p><div class="grid">'+[["VOD",c.vods],["Moments",c.moments],["Clips",c.clips],["Publiés",c.published]].map(([n,v])=>'<div class="card"><div class="muted">'+n+'</div><div class="stat">'+(v||0)+'</div></div>').join("")+'</div><div class="card"><h2>Services</h2><p>FFmpeg : '+(status.ffmpeg?"OK":"manquant")+' · Twitch : '+(status.twitch?.connected?"Connecté":"non connecté")+' · Whisper : '+(status.whisper?"OK":"optionnel")+'</p></div><div class="card"><h2>Tâches récentes</h2>'+(j.length?'<table>'+j.map(x=>'<tr><td>#'+x.id+' '+esc(x.kind)+'</td><td>'+esc(x.status)+'</td><td>'+Math.round((x.progress||0)*100)+'%</td><td>'+esc(x.message||x.error||"")+'</td></tr>').join("")+'</table>':'Aucune tâche')+'</div>'}
async function vods(){let v=await api("/api/vods");$("#app").innerHTML='<div class="row between"><div><h1>Bibliothèque VOD</h1><p class="muted">Twitch et fichiers vidéo locaux</p></div><button class="btn primary" id="sync">Synchroniser Twitch</button></div><div class="card"><form id="add" class="row"><input id="url" style="flex:1;min-width:240px" placeholder="URL Twitch ou fichier local"><button class="btn">Ajouter</button></form></div><div class="card"><table><tr><th>Titre</th><th>Durée</th><th>État</th><th>Moments</th><th></th></tr>'+v.map(x=>'<tr><td>'+esc(x.title)+'</td><td>'+fmt(x.duration)+'</td><td>'+esc(x.status)+(x.error?'<p class="danger">'+esc(x.error)+'</p>':'')+'</td><td>'+x.moments+'</td><td><button class="btn" onclick="analyze('+x.id+')">Analyser</button></td></tr>').join("")+'</table>'+(v.length?"":'<div class="empty">Aucune VOD</div>')+'</div>';$("#sync").onclick=()=>run(async()=>{let x=await api("/api/vods/sync","POST");msg(x.new+" VOD ajoutée(s)");vods()});$("#add").onsubmit=e=>run(async()=>{e.preventDefault();await api("/api/vods","POST",{url:$("#url").value});msg("VOD ajoutée");vods()})}
window.analyze=id=>run(async()=>{await api("/api/vods/"+id+"/analyze","POST");msg("Analyse lancée");go("moments")});
async function moments(){let r=await api("/api/gallery"),items=r.items||[];$("#app").innerHTML='<h1>Meilleurs moments</h1><p class="muted">Moments détectés automatiquement</p><div class="row">'+["all","new","draft","exported","hidden"].map(k=>'<span class="pill">'+k+' : '+(r.counts[k]||0)+'</span>').join("")+'</div><div class="cards" style="margin-top:14px">'+items.map(m=>'<div class="moment">'+(m.preview?.status==="preview"?'<video controls preload="none" src="/media/clips/'+m.preview.id+'"></video>':'<div class="empty">Pas d’aperçu</div>')+'<section><div class="row between"><b>'+esc(m.title||m.label||"Moment")+'</b><span class="pill">'+Math.round(m.score)+'/100</span></div><p class="muted">'+fmt(m.start)+' → '+fmt(m.end)+'</p><button class="btn primary" onclick="exportM('+m.id+')">Exporter 9:16</button></section></div>').join("")+'</div>'+(items.length?"":'<div class="empty">Lance une analyse depuis l’onglet VOD.</div>')}
window.exportM=id=>run(async()=>{await api("/api/moments/"+id+"/clips","POST",{fmt:"9:16"});msg("Rendu ajouté à la file");go("clips")});
async function clips(){let c=await api("/api/clips");$("#app").innerHTML='<h1>Clips</h1><p class="muted">Rendus et exports</p><div class="card"><table><tr><th>Titre</th><th>Format</th><th>Durée</th><th>État</th><th></th></tr>'+c.map(x=>'<tr><td>'+esc(x.title||"Clip "+x.id)+'</td><td>'+esc(x.fmt)+'</td><td>'+fmt(x.duration)+'</td><td>'+esc(x.status)+(x.error?'<p class="danger">'+esc(x.error)+'</p>':'')+'</td><td>'+(x.status==="done"?'<a href="/media/clips/'+x.id+'?download=true">Télécharger</a>':'')+'</td></tr>').join("")+'</table>'+(c.length?"":'<div class="empty">Aucun clip</div>')+'</div>'}
async function settings(){let s=await api("/api/settings");$("#app").innerHTML='<h1>Paramètres</h1><div class="card"><h2>Connexions</h2><div class="row"><a class="btn" href="/auth/twitch/login">Twitch</a><a class="btn" href="/auth/google/login">YouTube</a><a class="btn" href="/auth/tiktok/login">TikTok</a></div><p class="muted">Les clés API sont à configurer dans .env en local. Ne les publie jamais.</p></div><div class="card"><h2>Analyse</h2><form id="form" class="row"><label>Nombre de moments <input id="max_moments" type="number" min="1" max="40" value="'+s.max_moments+'"></label><label>Durée min. <input id="clip_min" type="number" value="'+s.clip_min+'"></label><label>Durée max. <input id="clip_max" type="number" value="'+s.clip_max+'"></label><button class="btn primary">Enregistrer</button></form></div>';$("#form").onsubmit=e=>run(async()=>{e.preventDefault();await api("/api/settings","PUT",{max_moments:+$("#max_moments").value,clip_min:+$("#clip_min").value,clip_max:+$("#clip_max").value});msg("Paramètres enregistrés")})}
render();setInterval(()=>{if(page==="dashboard")render()},8000);
</script></main></body></html>
